<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FutureSuShi | Đăng nhập</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/login.css">

</head>



<body>

<div class="login-page">

    <div class="login-card">

        <!-- LOGO -->

        <div class="login-logo">

            🍣

        </div>

        <h1>

            FutureSuShi

        </h1>

        <p>

            Đăng nhập để đặt món và quản lý đơn hàng

        </p>

        <!-- TAB -->

        <div class="login-tabs">

            <button
                type="button"
                id="loginTab"
                class="active">

                Đăng nhập

            </button>

            <button
                type="button"
                id="registerTab">

                Đăng ký

            </button>

        </div>

        <!--================ LOGIN ================-->

        <div id="loginBox">

            <form id="loginForm">

                <div class="form-group">

                    <label>

                        Tài khoản

                    </label>

                    <input
                        id="account"
                        type="text"
                        placeholder="Tên đăng nhập / SĐT / Email"
                        required>

                </div>

                <div class="form-group">

                    <label>

                        Mật khẩu

                    </label>

                    <input
                        id="password"
                        type="password"
                        placeholder="Nhập mật khẩu"
                        required>

                </div>

                <button
                    class="btn btn-primary btn-block"
                    type="submit">

                    Đăng nhập

                </button>

            </form>

        </div>

        <!--================ REGISTER ================-->

        <div
            id="registerBox"
            class="hidden">

            <form id="registerForm">

                <div class="form-group">

                    <label>

                        Họ và tên

                    </label>

                    <input
                        id="fullName"
                        type="text"
                        placeholder="Nhập họ tên"
                        required>

                </div>

                <div class="form-group">

                    <label>

                        Email

                    </label>

                    <input
                        id="email"
                        type="email"
                        placeholder="Nhập email">

                </div>

                <div class="form-group">

                    <label>

                        Số điện thoại

                    </label>

                    <input
                        id="phone"
                        type="tel"
                        placeholder="Nhập số điện thoại"
                        required>

                </div>

                <div class="form-group">

                    <label>

                        Tên đăng nhập

                    </label>

                    <input
                        id="username"
                        type="text"
                        placeholder="Tên đăng nhập"
                        required>

                </div>

                <div class="form-group">

                    <label>

                        Mật khẩu

                    </label>

                    <input
                        id="registerPassword"
                        type="password"
                        placeholder="Nhập mật khẩu"
                        required>

                </div>

                <button
                    class="btn btn-primary btn-block"
                    type="submit">

                    Đăng ký

                </button>

            </form>

        </div>

        <!-- BACK -->

        <div class="back-home">

            <a href="index.html">

                <i class="fa-solid fa-arrow-left"></i>

                Quay về Trang chủ

            </a>

        </div>

    </div>

</div>

<!-- JS -->

<script src="./js/app.js"></script>
<script src="./js/login.js"></script>

</body>

</html>
